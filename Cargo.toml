[workspace]
resolver = "2"
members = [
    "contracts/*",
    "cli",
    "tests/migrations",
    "tests/audit",
    "tests/event-ordering",
    "tests/admin",
    "tests/company-state",
    "tests/metadata",
    "tests/state",
    "tests/storage",
    "tests/access-control",
    "tests/events",
    "tests/event_schema",
    "tests/init_matrix",
]
exclude = ["fuzz", "contracts/tests"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
soroban-sdk = "27.0.6"
soroban-token-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true
