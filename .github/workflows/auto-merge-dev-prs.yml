name: Auto Handle Dev Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  handle-dev-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - name: Wait before first opened PR check
        if: ${{ github.event.action == 'opened' }}
        run: sleep 600

      - name: Stop if auto-merge token is missing
        if: ${{ secrets.AUTO_MERGE_TOKEN == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const mention = `@${pr.assignees?.[0]?.login || pr.user.login}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `${mention} CI/conflict automation cannot auto-merge this PR because AUTO_MERGE_TOKEN is not configured or is not available to this repository. Contributor action needed: none. Maintainer action needed: add the AUTO_MERGE_TOKEN Actions secret with maintainer merge permission for this repository, then trigger a fresh PR event or rerun this workflow.`,
            });
            core.setFailed("AUTO_MERGE_TOKEN is not configured or not available to this repository.");
      - name: Check CI, conflicts, and merge when ready
        if: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
        uses: actions/github-script@v7
        env:
          HAS_AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mention = `@${pr.assignees?.[0]?.login || pr.user.login}`;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function comment(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }

            async function getPullRequest() {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              return data;
            }

            async function waitForMergeability() {
              let current;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                current = await getPullRequest();
                if (current.mergeable !== null) return current;
                await sleep(10000);
              }
              return current || pr;
            }

            async function getCiState() {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pr.head.sha,
              });

              const relevantCheckRuns = checkRuns.filter((run) => run.name !== "handle-dev-pr");
              const failingChecks = relevantCheckRuns.filter((run) =>
                run.status === "completed" &&
                !["success", "neutral", "skipped"].includes(run.conclusion)
              );
              const pendingChecks = relevantCheckRuns.filter((run) => run.status !== "completed");
              const failingStatuses = combinedStatus.statuses.filter((status) => status.state === "failure" || status.state === "error");
              const pendingStatuses = combinedStatus.statuses.filter((status) => status.state === "pending");

              return {
                total: relevantCheckRuns.length + combinedStatus.statuses.length,
                failing: [...failingChecks.map((run) => run.name), ...failingStatuses.map((status) => status.context)],
                pending: [...pendingChecks.map((run) => run.name), ...pendingStatuses.map((status) => status.context)],
              };
            }

            async function waitForCi() {
              let state;
              for (let attempt = 0; attempt < 40; attempt += 1) {
                state = await getCiState();
                if (state.total > 0 && state.pending.length === 0) return state;
                await sleep(30000);
              }
              return state || { total: 0, failing: [], pending: [] };
            }

            let current = await waitForMergeability();
            if (current.mergeable === false || current.mergeable_state === "dirty") {
              await comment(`${mention} this PR has merge conflicts with dev. Please resolve the conflicts, push the fix, and the automation will recheck immediately.`);
              return;
            }

            const ci = await waitForCi();
            if (ci.total === 0) {
              await comment(`${mention} no CI result was found for this PR yet. Please confirm the CI workflow ran for dev and push another update if needed.`);
              return;
            }
            if (ci.pending.length > 0) {
              await comment(`${mention} CI is still pending after the automation wait window: ${ci.pending.join(", ")}. Push a new commit when ready and I will recheck immediately.`);
              return;
            }
            if (ci.failing.length > 0) {
              await comment(`${mention} CI failed on this PR: ${ci.failing.join(", ")}. Please fix the failing checks and push again; I will recheck immediately.`);
              return;
            }

            current = await waitForMergeability();
            if (current.mergeable === false || current.mergeable_state === "dirty") {
              await comment(`${mention} CI passed, but this PR now has merge conflicts with dev. Please resolve the conflicts and push again.`);
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: "squash",
              });
            } catch (error) {
              const hasAutoMergeToken = process.env.HAS_AUTO_MERGE_TOKEN === "true";
              if (error.message.includes("Resource not accessible by integration") && !hasAutoMergeToken) {
                await comment(`${mention} CI passed and no merge conflicts were detected. The remaining problem is repository automation permission: AUTO_MERGE_TOKEN is missing or unavailable to this repository. Contributor action needed: none. Maintainer action needed: add or grant the AUTO_MERGE_TOKEN Actions secret for this repository, then trigger a fresh PR event or rerun this workflow.`);
              } else if (error.message.includes("Resource not accessible by integration")) {
                await comment(`${mention} CI passed and no merge conflicts were detected, but GitHub still blocked the configured AUTO_MERGE_TOKEN from merging this PR. Contributor action needed: none. Maintainer action needed: check that AUTO_MERGE_TOKEN belongs to a maintainer with write/admin access, has repo and workflow scope or fine-grained Contents/Pull requests read-write access, is authorized for the zkpayroll organization, and is allowed by the dev branch ruleset; otherwise merge manually after review.`);
              } else {
                await comment(`${mention} CI passed and no merge conflicts were detected, but GitHub blocked the auto-merge: ${error.message}. Contributor action needed: none unless a maintainer asks for code changes. Maintainer action needed: check required reviews, branch protection/rulesets, and merge settings, or manually merge after review.`);
              }
              throw error;
            }
