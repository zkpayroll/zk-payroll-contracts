name: Close Linked Issues On Dev Merge

on:
  pull_request_target:
    types: [closed]
    branches:
      - dev

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - name: Close issues linked to merged dev PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentOwner = owner.toLowerCase();
            const currentRepo = repo.toLowerCase();

            const refs = new Map();

            function addRef(refOwner, refRepo, issueNumber, source) {
              const targetOwner = (refOwner || owner).toLowerCase();
              const targetRepo = (refRepo || repo).toLowerCase();
              if (targetOwner !== currentOwner || targetRepo !== currentRepo) return;
              const number = Number(issueNumber);
              if (!Number.isInteger(number) || number <= 0) return;
              refs.set(String(number), { number, source });
            }

            const text = [pr.title || '', pr.body || ''].join('\n');
            const closingBlockPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+((?:(?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+)(?:[\s,]*(?:and\s+)?(?:(?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+)*)/gi;
            const refPattern = /(?:(?<owner>[A-Za-z0-9_.-]+)\/(?<repo>[A-Za-z0-9_.-]+))?#(?<number>\d+)/g;

            for (const match of text.matchAll(closingBlockPattern)) {
              for (const ref of match[1].matchAll(refPattern)) {
                addRef(ref.groups.owner, ref.groups.repo, ref.groups.number, 'closing keyword');
              }
            }

            const titleIssue = (pr.title || '').match(/\(#(?<number>\d+)\)\s*$/);
            if (titleIssue) {
              addRef(null, null, titleIssue.groups.number, 'PR title suffix');
            }

            if (refs.size === 0) {
              core.info('No linked issue references found in PR title or body.');
              return;
            }

            const closed = [];
            const skipped = [];
            const failures = [];

            for (const { number, source } of refs.values()) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: number,
                });

                if (issue.pull_request) {
                  skipped.push(`#${number} is a pull request`);
                  continue;
                }

                if (issue.state === 'closed') {
                  skipped.push(`#${number} was already closed`);
                  continue;
                }

                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: number,
                    body: `Closed automatically because PR #${pr.number} was merged into dev. Source: ${source}.`,
                  });
                } catch (commentError) {
                  core.warning(`Could not comment on #${number}: ${commentError.message}`);
                }

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: number,
                  state: 'closed',
                  state_reason: 'completed',
                });

                closed.push(`#${number}`);
              } catch (error) {
                failures.push(`#${number}: ${error.message}`);
                core.warning(`Could not close #${number}: ${error.message}`);
              }
            }

            if (closed.length > 0 || skipped.length > 0 || failures.length > 0) {
              const lines = [];
              if (closed.length > 0) lines.push(`Closed linked issue(s): ${closed.join(', ')}.`);
              if (skipped.length > 0) lines.push(`Skipped: ${skipped.join(', ')}.`);
              if (failures.length > 0) lines.push(`Could not close: ${failures.join(', ')}.`);
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: lines.join('\n'),
                });
              } catch (commentError) {
                core.warning(`Could not comment on PR #${pr.number}: ${commentError.message}`);
              }
            }

            if (closed.length === 0 && failures.length > 0) {
              core.setFailed(`No linked issues were closed. Failures: ${failures.join(', ')}`);
            }
