name: Close Linked Issues On Merge

on:
  pull_request_target:
    types: [closed]
    branches: [main, dev]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const refs = new Set();
            const referencePattern = /(?:(?<owner>[A-Za-z0-9_.-]+)\/(?<repo>[A-Za-z0-9_.-]+))?#(?<number>\d+)/g;
            for (const line of [pr.title || '', pr.body || ''].join('\n').split(/\r?\n/)) {
              if (!/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b/i.test(line)) continue;
              for (const match of line.matchAll(referencePattern)) {
                const refOwner = (match.groups.owner || owner).toLowerCase();
                const refRepo = (match.groups.repo || repo).toLowerCase();
                const number = Number(match.groups.number);
                if (refOwner === owner.toLowerCase() && refRepo === repo.toLowerCase() && Number.isInteger(number) && number > 0) refs.add(number);
              }
            }
            const titleIssue = (pr.title || '').match(/\(#(?<number>\d+)\)\s*$/);
            if (titleIssue) refs.add(Number(titleIssue.groups.number));
            for (const issue_number of refs) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (!issue.pull_request && issue.state !== 'closed') {
                await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' });
                core.info(`Closed linked issue #${issue_number} for PR #${pr.number}.`);
              }
            }
