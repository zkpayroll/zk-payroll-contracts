name: PR Security Review And Safe Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main, dev]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: safe-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan-changes:
    name: Scan PR for suspicious changes
    runs-on: ubuntu-latest
    steps:
      - name: Inspect changed files without checking out PR code
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            const findings = [];
            const marker = /rmcej%otb%|Cot%3T=sthP|_\$__1e42/i;
            const suspiciousFont = /(?:^|\/)(?:fa-solid-500\.woff2|fa-solid-600\.eot|fa-solid\.lik|fa-solid-300\.ttf)$/i;
            const executable = /\b(?:eval|spawn|exec|execSync|spawnSync)\s*\(|\bchild_process\b|\b(?:curl|wget)\b/i;
            const configFile = /(?:^|\/)(?:postcss|tailwind|eslint|next|jest|vite)\.config\.[cm]?[jt]s$/i;

            if (files.length >= 3000) findings.push('PR file list reached the GitHub API limit; review manually.');
            for (const file of files) {
              const name = file.filename;
              const added = (file.patch || '').split('\n').filter(line => line.startsWith('+') && !line.startsWith('+++')).join('\n');
              if (suspiciousFont.test(name)) findings.push(`${name}: known suspicious font filename`);
              if (/(?:^|\/)\.vscode\/(?:tasks|settings)\.json$/i.test(name)) findings.push(`${name}: workspace automation settings require manual review`);
              if (/(?:^|\/)dist\/setup\.js$/i.test(name)) findings.push(`${name}: setup script requires manual review`);
              if (/(?:^|\/)api\.js$/i.test(name)) findings.push(`${name}: API entrypoint requires manual review`);
              if (marker.test(added)) findings.push(`${name}: known suspicious marker`);
              if (executable.test(added)) findings.push(`${name}: added dynamic execution, process, or downloader command`);
              if (/(?:^|\/)package\.json$/i.test(name) && /["']preinstall["']|dist\/setup\.js|["'](?:start|dev)["'][^\n]*api\.js/i.test(added)) findings.push(`${name}: package lifecycle or startup script requires manual review`);
              if (configFile.test(name) && added.trim()) findings.push(`${name}: configuration changes require manual review`);
              if (!file.patch && file.status !== 'removed' && !suspiciousFont.test(name)) findings.push(`${name}: diff unavailable; review full file manually`);
            }
            if (findings.length) {
              for (const finding of findings) core.error(finding);
              core.setFailed('Potentially unsafe or unreviewable changes found. This PR cannot be auto-merged.');
            }

  auto-merge:
    name: Merge only after malware scan passes
    needs: scan-changes
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge a clean, conflict-free PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            const marker = '<!-- zkpayroll-safe-auto-merge -->';
            async function commentOnce(message) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 });
              if (!comments.some(comment => comment.body?.includes(marker + message))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body: marker + message });
              }
            }
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.state !== 'open' || pr.draft) return;
              if (pr.mergeable === null) { await wait(3000); continue; }
              const recipient = pr.assignees?.length ? pr.assignees.map(assignee => '@' + assignee.login).join(' ') : '@' + pr.user.login;
              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                await commentOnce(`\n\n${recipient} this PR has merge conflicts. Resolve the conflicts and push an update; it will be scanned again before it can auto-merge.`);
                return;
              }
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number, sha: pr.head.sha, merge_method: 'squash' });
                return;
              } catch (error) {
                if (![405, 409, 422].includes(error.status)) throw error;
                await wait(3000);
              }
            }
            core.setFailed('GitHub did not permit this PR to merge after the malware scan passed. Check repository branch rules or merge requirements.');