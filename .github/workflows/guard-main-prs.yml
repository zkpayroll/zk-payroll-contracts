name: Guard Main Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-main-target-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.state == 'open' }}
    steps:
      - name: Comment and close PRs targeting main
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const mention = `@${pr.assignees?.[0]?.login || pr.user.login}`;
            const message = [
              `${mention} thanks for contributing. This repository does not accept pull requests directly into main.`,
              "",
              "Please change the PR base branch to `dev` and reopen it there. The automation will review CI, merge conflicts, and merge eligible PRs into `dev` automatically."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
